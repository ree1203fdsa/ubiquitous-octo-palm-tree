<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>게임 피드백</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root {
  --bg: #0a0a0f;
  --bg-card: #12121a;
  --bg-input: #1a1a26;
  --fg: #e8e6f0;
  --fg-dim: #8884a0;
  --fg-muted: #5c587a;
  --accent: #7c6aef;
  --accent-soft: rgba(124,106,239,0.12);
  --green: #4ade80;
  --yellow: #fbbf24;
  --red: #f87171;
  --border: rgba(255,255,255,0.06);
  --radius: 12px;
  --radius-sm: 8px;
  color-scheme: dark;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Noto Sans KR', system-ui, sans-serif;
  background: var(--bg);
  color: var(--fg);
  line-height: 1.6;
  min-height: 100vh;
}
.container { max-width: 760px; margin: 0 auto; padding: 0 20px 80px; }

.site-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 24px 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: 32px;
  gap: 12px;
}
.site-header h1 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: clamp(22px, 4vw, 30px);
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent), #c084fc);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  cursor: pointer;
}
h2 { font-size: 17px; font-weight: 600; margin-bottom: 14px; }

.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 16px;
}

.form-row { margin-bottom: 16px; }
.form-row label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--fg-dim);
  margin-bottom: 5px;
  letter-spacing: 0.04em;
}
.form-row input, .form-row textarea {
  width: 100%;
  padding: 11px 14px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--fg);
  font-family: inherit;
  font-size: 15px;
  outline: none;
}
.form-row input:focus, .form-row textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.form-row textarea { resize: vertical; min-height: 90px; }

.btn {
  padding: 12px 18px;
  border: none;
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn-primary { width: 100%; background: linear-gradient(135deg, var(--accent), #9b7aff); color: #fff; }
.btn-outline { background: none; border: 1px solid var(--border); color: var(--fg-dim); font-size: 13px; padding: 8px 14px; }
.btn-outline:hover { color: var(--fg); }
.btn-danger { background: rgba(248,113,113,0.12); color: var(--red); font-size: 13px; padding: 7px 14px; }

.msg { font-size: 13px; margin-top: 10px; min-height: 20px; }
.msg.error { color: var(--red); }
.msg.ok { color: var(--green); }

.game-btn {
  display: block;
  width: 100%;
  padding: 16px 18px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--fg);
  font-family: inherit;
  text-align: left;
  cursor: pointer;
  margin-bottom: 10px;
}
.game-btn:hover, .game-btn:focus-visible { border-color: var(--accent); outline: none; }
.game-btn .name { font-weight: 600; font-size: 16px; }
.game-btn .desc { font-size: 13px; color: var(--fg-dim); margin-top: 2px; }

.tabs {
  display: flex;
  gap: 4px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 4px;
  margin-bottom: 24px;
}
.tab {
  flex: 1;
  padding: 10px;
  border: none;
  background: none;
  color: var(--fg-dim);
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  border-radius: var(--radius-sm);
  cursor: pointer;
}
.tab.active { background: var(--accent); color: #fff; }

.row-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 10px;
}
.row-item .name { font-weight: 600; }
.row-item .desc { font-size: 13px; color: var(--fg-dim); }

.fb-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 14px;
}
.fb-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
.fb-tag {
  display: inline-block;
  padding: 2px 10px;
  background: var(--accent-soft);
  color: var(--accent);
  border-radius: 20px;
  font-size: 12px;
  margin-bottom: 6px;
}
.fb-name { font-weight: 600; }
.fb-date { font-size: 12px; color: var(--fg-muted); }
.fb-comment {
  font-size: 14px;
  color: var(--fg-dim);
  background: var(--bg-input);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  white-space: pre-wrap;
  word-break: break-word;
}
.filter { margin-bottom: 16px; }
.filter select {
  padding: 9px 12px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--fg);
  font-family: inherit;
  font-size: 14px;
}

.empty { text-align: center; padding: 40px 20px; color: var(--fg-muted); font-size: 14px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="container">
  <header class="site-header">
    <h1 onclick="showPublic()">GAME FEEDBACK</h1>
    <button class="btn btn-outline" id="admin-toggle" onclick="toggleAdmin()">관리자</button>
  </header>

  <!-- 공개: 게임 선택 -->
  <section id="view-games">
    <h2>피드백할 게임을 선택하세요</h2>
    <div id="game-list"><div class="empty">불러오는 중...</div></div>
  </section>

  <!-- 공개: 피드백 작성 -->
  <section id="view-form" hidden>
    <button class="btn btn-outline" onclick="showPublic()" style="margin-bottom:16px">← 게임 목록</button>
    <div class="card">
      <h2 id="form-game-name" style="margin-bottom:2px"></h2>
      <p id="form-game-desc" style="font-size:13px;color:var(--fg-dim);margin-bottom:20px"></p>
      <form id="fb-form">
        <div class="form-row">
          <label for="fb-name">이름</label>
          <input type="text" id="fb-name" maxlength="30" required placeholder="이름을 입력하세요">
        </div>
        <div class="form-row">
          <label for="fb-comment">피드백 내용</label>
          <textarea id="fb-comment" maxlength="2000" required placeholder="게임에 대한 솔직한 의견을 적어주세요"></textarea>
        </div>
        <button type="submit" class="btn btn-primary" id="fb-submit">피드백 보내기</button>
        <div class="msg" id="fb-msg"></div>
      </form>
    </div>
  </section>

  <!-- 관리자: 비밀번호 -->
  <section id="view-admin-login" hidden>
    <div class="card" style="max-width:380px;margin:40px auto">
      <h2>관리자 확인</h2>
      <form id="admin-login-form">
        <div class="form-row">
          <label for="admin-pw">관리자 비밀번호</label>
          <input type="password" id="admin-pw" required autocomplete="off" data-lpignore="true" data-1p-ignore>
        </div>
        <button type="submit" class="btn btn-primary">확인</button>
        <div class="msg error" id="admin-login-msg"></div>
      </form>
    </div>
  </section>

  <!-- 관리자: 대시보드 -->
  <section id="view-admin" hidden>
    <div class="tabs">
      <button class="tab active" data-tab="games">게임 관리</button>
      <button class="tab" data-tab="feedback">받은 피드백</button>
    </div>

    <div id="admin-games">
      <div class="card">
        <h2>새 게임 등록</h2>
        <form id="add-game-form">
          <div class="form-row">
            <label for="new-game-name">게임 / 사이트 이름</label>
            <input type="text" id="new-game-name" required>
          </div>
          <div class="form-row">
            <label for="new-game-desc">설명 (선택)</label>
            <textarea id="new-game-desc" rows="2" style="min-height:60px"></textarea>
          </div>
          <button type="submit" class="btn btn-primary" id="add-game-btn">등록</button>
          <div class="msg" id="add-game-msg"></div>
        </form>
      </div>
      <h2 style="margin-top:24px">등록된 게임</h2>
      <div id="admin-game-list"></div>
    </div>

    <div id="admin-feedback" hidden>
      <div class="filter">
        <select id="fb-filter" aria-label="게임별 보기"><option value="">전체 게임</option></select>
      </div>
      <div id="admin-fb-list"></div>
    </div>
  </section>
</div>

<script>
let games = [];
let selectedGame = null;
let adminPw = '';
let allFeedback = [];

const $ = id => document.getElementById(id);
function esc(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }
function show(id) {
  ['view-games', 'view-form', 'view-admin-login', 'view-admin'].forEach(v => $(v).hidden = v !== id);
  $('admin-toggle').textContent = id.startsWith('view-admin') ? '피드백 쓰기' : '관리자';
}

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (adminPw) headers['X-Admin-Password'] = encodeURIComponent(adminPw.trim());
  const res = await fetch(path, { ...opts, headers });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(data.error || '요청 실패'); e.status = res.status; throw e; }
  return data;
}

// ---- 공개 화면 ----
async function loadGames() {
  games = await api('/api/games');
  return games;
}

async function showPublic() {
  show('view-games');
  const el = $('game-list');
  try {
    await loadGames();
    if (!games.length) { el.innerHTML = '<div class="empty">아직 등록된 게임이 없습니다.</div>'; return; }
    el.innerHTML = games.map(g => `
      <button class="game-btn" onclick="openForm('${g.id}')">
        <div class="name">${esc(g.name)}</div>
        ${g.description ? `<div class="desc">${esc(g.description)}</div>` : ''}
      </button>`).join('');
  } catch { el.innerHTML = '<div class="empty">게임 목록을 불러오지 못했습니다.</div>'; }
}

function openForm(id) {
  selectedGame = games.find(g => g.id === id);
  if (!selectedGame) return;
  $('form-game-name').textContent = selectedGame.name;
  $('form-game-desc').textContent = selectedGame.description || '';
  $('fb-comment').value = '';
  $('fb-msg').textContent = '';
  show('view-form');
  $('fb-name').focus();
}

$('fb-form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('fb-submit'), msg = $('fb-msg');
  btn.disabled = true; msg.className = 'msg'; msg.textContent = '';
  const body = { gameId: selectedGame.id, name: $('fb-name').value.trim(), comment: $('fb-comment').value.trim() };
  try {
    await api('/api/feedback', { method: 'POST', body: JSON.stringify(body) });
    msg.className = 'msg ok';
    msg.textContent = '피드백이 전송되었습니다. 감사합니다!';
    $('fb-comment').value = '';
  } catch (err) {
    msg.className = 'msg error';
    msg.textContent = err.message;
  } finally { btn.disabled = false; }
});

// ---- 관리자 ----
function toggleAdmin() {
  if (!$('view-admin').hidden || !$('view-admin-login').hidden) return showPublic();
  if (adminPw) return openAdmin();
  show('view-admin-login');
  $('admin-pw').focus();
}

$('admin-login-form').addEventListener('submit', async e => {
  e.preventDefault();
  adminPw = $('admin-pw').value;
  try {
    await api('/api/feedback');
    $('admin-pw').value = '';
    $('admin-login-msg').textContent = '';
    openAdmin();
  } catch (err) {
    adminPw = '';
    $('admin-login-msg').textContent = err.status === 401 ? '비밀번호가 틀렸습니다.' : err.message;
  }
});

function adminFailed(err) {
  if (err.status === 401) {
    adminPw = '';
    show('view-admin-login');
    $('admin-login-msg').textContent = '다시 로그인하세요.';
    return true;
  }
  return false;
}

async function openAdmin() {
  show('view-admin');
  switchTab('games');
}

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  $('admin-games').hidden = tab !== 'games';
  $('admin-feedback').hidden = tab !== 'feedback';
  if (tab === 'games') renderAdminGames();
  else loadAdminFeedback();
}

async function renderAdminGames() {
  const el = $('admin-game-list');
  try {
    await loadGames();
    if (!games.length) { el.innerHTML = '<div class="empty">등록된 게임이 없습니다.</div>'; return; }
    el.innerHTML = games.map(g => `
      <div class="row-item">
        <div style="min-width:0">
          <div class="name">${esc(g.name)}</div>
          ${g.description ? `<div class="desc">${esc(g.description)}</div>` : ''}
        </div>
        <button class="btn btn-danger" onclick="deleteGame('${g.id}')">삭제</button>
      </div>`).join('');
  } catch { el.innerHTML = '<div class="empty">불러오지 못했습니다.</div>'; }
}

$('add-game-form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('add-game-btn'), msg = $('add-game-msg');
  btn.disabled = true; msg.textContent = '';
  try {
    await api('/api/games', { method: 'POST', body: JSON.stringify({
      name: $('new-game-name').value.trim(),
      description: $('new-game-desc').value.trim(),
    }) });
    $('new-game-name').value = ''; $('new-game-desc').value = '';
    msg.className = 'msg ok'; msg.textContent = '등록되었습니다.';
    renderAdminGames();
  } catch (err) {
    if (!adminFailed(err)) { msg.className = 'msg error'; msg.textContent = err.message; }
  } finally { btn.disabled = false; }
});

async function deleteGame(id) {
  if (!confirm('이 게임을 삭제할까요?')) return;
  try { await api('/api/games', { method: 'DELETE', body: JSON.stringify({ id }) }); renderAdminGames(); }
  catch (err) { if (!adminFailed(err)) alert(err.message); }
}

async function loadAdminFeedback() {
  const el = $('admin-fb-list');
  el.innerHTML = '<div class="empty">불러오는 중...</div>';
  try {
    if (!games.length) await loadGames();
    allFeedback = await api('/api/feedback');
    const sel = $('fb-filter'), cur = sel.value;
    sel.innerHTML = '<option value="">전체 게임</option>' +
      games.map(g => `<option value="${g.id}">${esc(g.name)}</option>`).join('');
    sel.value = cur;
    renderFeedback();
  } catch (err) {
    if (!adminFailed(err)) el.innerHTML = '<div class="empty">불러오지 못했습니다.</div>';
  }
}
$('fb-filter').addEventListener('change', renderFeedback);

function renderFeedback() {
  const el = $('admin-fb-list');
  const f = $('fb-filter').value;
  const list = f ? allFeedback.filter(x => x.gameId === f) : allFeedback;
  if (!list.length) { el.innerHTML = '<div class="empty">아직 받은 피드백이 없습니다.</div>'; return; }
  el.innerHTML = list.map(fb => {
    const gameName = (games.find(g => g.id === fb.gameId) || {}).name || '삭제된 게임';
    const date = new Date(fb.createdAt).toLocaleString('ko-KR', { dateStyle: 'medium', timeStyle: 'short' });
    return `<div class="fb-card">
      <div class="fb-top">
        <div>
          <span class="fb-tag">${esc(gameName)}</span>
          <div class="fb-name">${esc(fb.name || '익명')}</div>
          <div class="fb-date">${date}</div>
        </div>
      </div>
      <div class="fb-comment">${esc(fb.comment)}</div>
      <button class="btn btn-danger" style="margin-top:12px" onclick="deleteFeedback('${fb.id}')">삭제</button>
    </div>`;
  }).join('');
}

async function deleteFeedback(id) {
  if (!confirm('이 피드백을 삭제할까요?')) return;
  try { await api('/api/feedback', { method: 'DELETE', body: JSON.stringify({ id }) }); loadAdminFeedback(); }
  catch (err) { if (!adminFailed(err)) alert(err.message); }
}

showPublic();
</script>
</body>
</html>
